  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --elevated: #242424;
      --accent: #fdab4e;
      --text: #e8e8e8;
      --text-secondary: #aaa;
      --text-muted: #666;
      --border: #2a2a2a;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .app-name { font-size: 1rem; font-weight: 600; color: var(--text); }
    .app-sub  { font-size: 0.8rem; color: var(--text-muted); }

    /* ── Controls bar ── */
    .controls {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Doc tabs */
    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }
    .tab-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #1a0a00;
      font-weight: 700;
    }

    /* Language pills */
    .lang-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .lang-btn {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .lang-btn:hover  { border-color: var(--accent); color: var(--accent); }
    .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #1a0a00; font-weight: 600; }

    /* ── Content ── */
    main { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }

    .doc-title {
      font-size: 1.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .doc-meta {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 40px;
    }

    .section { margin-bottom: 32px; }
    .section h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .section p { color: #ccc; font-size: 0.95rem; }
    .section p + p { margin-top: 8px; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }

    /* RTL support for Arabic */
    [dir="rtl"] main { text-align: right; }
  </style>
</head>

// ─────────────────────────────────────────────────────────────────────────────
// STATE & RENDER
// ─────────────────────────────────────────────────────────────────────────────

let currentLang = 'en';
let currentDoc  = 'privacy';

function render() {
  const data = CONTENT[currentLang][currentDoc];
  const dir  = CONTENT[currentLang].dir;

  document.documentElement.lang = currentLang;
  document.documentElement.dir  = dir;

  const html = `
    <h1 class="doc-title">${data.title}</h1>
    <p class="doc-meta">${data.meta}</p>
    ${data.sections.map(s => `
      <div class="section">
        <h2>${s.h}</h2>
        <p>${s.p}</p>
      </div>
    `).join('')}
  `;

  document.getElementById('content').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function setDoc(doc) {
  currentDoc = doc;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

// Initial render
render();
</script>
