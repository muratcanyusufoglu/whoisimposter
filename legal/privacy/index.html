    .app-sub { font-size: 0.8rem; color: var(--text-muted); }
    .controls { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .doc-links { display: flex; gap: 8px; }
    .doc-link { padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; text-decoration: none; color: var(--text-muted); border: 1px solid var(--border); transition: all 0.15s; }
    .doc-link:hover { border-color: var(--accent); color: var(--accent); }
    .doc-link.active { background: var(--accent); border-color: var(--accent); color: #1a0a00; font-weight: 700; }
    .lang-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .lang-btn { padding: 4px 12px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
    .lang-btn:hover { border-color: var(--accent); color: var(--accent); }
    .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #1a0a00; font-weight: 600; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }
    .doc-title { font-size: 1.9rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .doc-meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 40px; }
    .section { margin-bottom: 32px; }
    .section h2 { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .section p { color: #ccc; font-size: 0.95rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border); }

let currentLang = 'en';

function setLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const d = DATA[currentLang];
  document.documentElement.lang = currentLang;
  document.documentElement.dir = d.dir;
  document.getElementById('content').innerHTML = `
    <h1 class="doc-title">${d.title}</h1>
    <p class="doc-meta">${d.meta}</p>
    ${d.sections.map(s => `<div class="section"><h2>${s.h}</h2><p>${s.p}</p></div>`).join('')}
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
